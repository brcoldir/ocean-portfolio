server {
    server_name oceancoldiron.com www.oceancoldiron.com;

    root /home/ubuntu/app/dist;
    index index.html;

    # SEO: one canonical host (no www)
    if ($host = www.oceancoldiron.com) {
        return 301 https://oceancoldiron.com$request_uri;
    }

    # SEO: compress text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript text/javascript application/json application/xml text/xml application/rss+xml image/svg+xml text/plain;

    # Serve the React Frontend. Known SPA routes get prerendered HTML;
    # anything else that is not a real file returns a real 404.
    error_page 404 /404.html;
    location = /404.html { internal; }
    location = / {
        try_files /index.html =404;
    }
    location = /coldiron {
        try_files /coldiron.html /index.html;
    }
    location = /coldiron/ {
        return 301 https://oceancoldiron.com/coldiron;
    }
    location = /manageai {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /manageai.html /index.html;
    }
    location = /manageai/ {
        return 301 https://oceancoldiron.com/manageai;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri =404;
    }

    # Proxy API requests to Go Backend
    # oceansoutdoors blog (static, /var/www/oceansoutdoors)
    location = /oceansoutdoors {
        return 301 /oceansoutdoors/;
    }
    # Retired standalone Echo Canyon page: photo now lives on Kings Peak
    location = /oceansoutdoors/stories/echo-canyon/ {
        return 301 https://oceancoldiron.com/oceansoutdoors/stories/kings-peak/;
    }
    location = /oceansoutdoors/stories/echo-canyon {
        return 301 https://oceancoldiron.com/oceansoutdoors/stories/kings-peak/;
    }
    location ^~ /oceansoutdoors/ {
        root /var/www;
        error_page 404 /oceansoutdoors/404.html;
        try_files $uri $uri/index.html =404;
        # Directory URLs without a trailing slash: 301 to the slash version
        location ~ ^/oceansoutdoors/[^.]*[^/]$ {
            return 301 https://oceancoldiron.com$uri/$is_args$args;
        }
        location ~* \.(jpg|jpeg|png|webp|css|js|svg|ico)$ {
            expires 30d;
            add_header Cache-Control "public";
        }
    }

    location /api/ {
        proxy_pass http://localhost:8080;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/oceancoldiron.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/oceancoldiron.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.oceancoldiron.com) {
        return 301 https://oceancoldiron.com$request_uri;
    } # managed by Certbot


    if ($host = oceancoldiron.com) {
        return 301 https://oceancoldiron.com$request_uri;
    } # managed by Certbot


    listen 80;
    server_name oceancoldiron.com www.oceancoldiron.com;
    return 404; # managed by Certbot




}